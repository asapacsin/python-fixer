[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "python-fixer"
version = "0.1.0"
description = "Reproducible Python repair data, isolated rewards and RLVR research tooling"
requires-python = ">=3.11,<3.13"
dependencies = ["jsonschema==4.25.1"]

[project.optional-dependencies]
dev = ["jsonschema==4.25.1"]

[tool.python-fixer]
stage = "M1-implementation"
training-implemented = false
default-check = "python3 scripts/validate_repository.py"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"python_fixer.data" = ["fixtures.json"]

[tool.setuptools.data-files]
"share/python-fixer/schemas" = ["schemas/*.json"]
"share/python-fixer/configs/prompts" = ["configs/prompts/*.txt"]
